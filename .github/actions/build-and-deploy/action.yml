name: Build and deploy to S3
description: Build the Hexo site and sync it to the given S3 bucket (repo must already be checked out)

inputs:
  s3-bucket:
    description: Destination S3 bucket (e.g. s3://meltan.ca-staging)
    required: true
  aws-access-key-id:
    description: AWS access key ID
    required: true
  aws-secret-access-key:
    description: AWS secret access key
    required: true
  aws-region:
    description: AWS region
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Generate site
      run: npx hexo generate
      shell: bash

    - name: Upload to S3
      run: aws s3 sync public/ ${{ inputs.s3-bucket }} --delete
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_REGION: ${{ inputs.aws-region }}
