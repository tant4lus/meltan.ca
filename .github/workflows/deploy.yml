name: Build and Deploy Hexo to S3

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  deploy-staging:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: AWS
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        run: npx hexo generate

      - name: Upload to S3 (staging)
        run: aws s3 sync public/ s3://meltan.ca-staging --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Comment staging URL on PR
        uses: actions/github-script@v7
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          script: |
            const region = process.env.AWS_REGION;
            const url = `http://meltan.ca-staging.s3-website-${region}.amazonaws.com`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Staging deploy is live: ${url}`
            });

  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: AWS

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        run: npx hexo generate

      - name: Upload to S3 (production)
        run: aws s3 sync public/ s3://meltan.ca --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
