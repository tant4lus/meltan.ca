name: Build and Deploy Hexo to S3

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  deploy-staging:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build and deploy
        uses: ./.github/actions/build-and-deploy
        with:
          s3-bucket: s3://meltan.ca-staging
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Comment staging URL on PR
        uses: actions/github-script@v7
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          script: |
            const region = process.env.AWS_REGION;
            const url = `http://meltan.ca-staging.s3-website-${region}.amazonaws.com`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Staging deploy is live: ${url}`
            });

  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build and deploy
        uses: ./.github/actions/build-and-deploy
        with:
          s3-bucket: s3://meltan.ca
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
