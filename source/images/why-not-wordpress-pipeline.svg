<svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Deploy pipeline: PR to staging, merge to production</title>
  <desc>On every pull request, GitHub Actions builds the site and syncs it to a staging S3 bucket, then comments the staging URL on the PR. On merge to main, GitHub Actions builds again, syncs to the production S3 bucket, invalidates CloudFront, and the site goes live.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="760" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left lane: PR / staging -->
  <text x="170" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">On every Pull Request</text>

  <g font-size="13.5" fill="#1f2937">
    <rect x="20" y="70" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="170" y="103" text-anchor="middle">Push branch / open PR</text>

    <line x1="170" y1="126" x2="170" y2="152" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="20" y="156" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="170" y="189" text-anchor="middle">GitHub Actions: hexo generate</text>

    <line x1="170" y1="212" x2="170" y2="238" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="20" y="242" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="170" y="275" text-anchor="middle">Sync to S3: meltan.ca-staging</text>

    <line x1="170" y1="298" x2="170" y2="324" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="20" y="328" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="170" y="357" text-anchor="middle">Bot comments staging URL</text>
    <text x="170" y="374" text-anchor="middle" font-size="12" fill="#6b7280">on the PR for review</text>
  </g>

  <!-- Connector between lanes -->
  <text x="365" y="337" text-anchor="middle" font-size="11.5" fill="#6b7280">approved &amp;</text>
  <text x="365" y="350" text-anchor="middle" font-size="11.5" fill="#6b7280">merged</text>
  <line x1="320" y1="365" x2="410" y2="365" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Right lane: merge / production -->
  <text x="570" y="313" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">On merge to main</text>

  <g font-size="13.5" fill="#1f2937">
    <rect x="420" y="328" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="570" y="361" text-anchor="middle">Merge to main</text>

    <line x1="570" y1="384" x2="570" y2="410" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="420" y="414" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="570" y="447" text-anchor="middle">GitHub Actions: hexo generate</text>

    <line x1="570" y1="470" x2="570" y2="496" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="420" y="500" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="570" y="533" text-anchor="middle">Sync to S3: meltan.ca</text>

    <line x1="570" y1="556" x2="570" y2="582" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="420" y="586" width="300" height="56" rx="8" fill="#eef4fc" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="570" y="619" text-anchor="middle">Invalidate CloudFront</text>

    <line x1="570" y1="642" x2="570" y2="668" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <rect x="420" y="672" width="300" height="56" rx="8" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.5"/>
    <text x="570" y="705" text-anchor="middle" font-weight="600" fill="#166534">Live at meltan.ca</text>
  </g>
</svg>
